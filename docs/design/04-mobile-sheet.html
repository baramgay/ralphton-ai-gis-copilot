<!DOCTYPE html>
<!--
  누리맵 시안 04 — 모바일 393×727 · 다크 · 결과 시트(56dvh)가 올라온 상태
  재질 판단: 시트는 「지도 위로 올라오는 층」이라 유리를 쓰되, 숫자를 읽는 자리이므로
  --glass-bg-strong(85%) 이상의 무거운 유리. 스크림 없음 — 병렬 패널이라 흐름을 끊지 않는다.
  도크는 시트 위 가장자리 바로 위로 올라온다 (bottom: calc(--sheet-height + 0.6rem), z-index 40).
  시트가 열리면 예시 칩(.is-optional)은 접는다 — 답을 보는 사람에게 추천 질문은 필요 없다.
-->
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누리맵 시안 04 — 모바일 결과 시트</title>
<style>
:root {
  color-scheme: dark;
  --background: #080f1c; --foreground: #e2e8f0;
  --fs-caption: 0.6875rem; --fs-chip: 0.75rem; --fs-body: 0.8125rem;
  --fs-body-lg: 0.875rem; --fs-title: 0.9375rem; --fs-display: 1.0625rem;
  --lh-tight: 1.35; --lh-body: 1.55;
  --surface-0: #080f1c; --surface-1: rgb(13 21 36 / 97%); --surface-2: #101a2c;
  --surface-3: #0b1322; --surface-map: #0a1120;
  --border-1: rgb(38 54 80 / 90%); --border-2: #26364f; --border-soft: #182339;
  --text-1: #f1f5f9; --text-2: #c7d2e0; --text-3: #8fa3bd; --text-4: #64748b;
  --accent: #22d3ee; --accent-soft: rgb(34 211 238 / 14%); --accent-line: rgb(34 211 238 / 45%);
  --accent-warm: #fbbf24; --accent-warm-soft: rgb(251 191 36 / 14%);
  --rank-value: #67e8f9; --score-track: #16233a;

  --glass-bg: rgb(13 21 36 / 72%);
  --glass-bg-strong: rgb(10 17 30 / 85%);
  --glass-border: rgb(148 163 184 / 30%);
  --glass-edge: inset 0 1px 0 rgb(255 255 255 / 13%), inset 0 -1px 0 rgb(0 0 0 / 35%);
  --glass-shadow: 0 14px 36px rgb(0 0 0 / 50%), 0 2px 8px rgb(0 0 0 / 35%);
  --glass-blur: blur(24px) saturate(170%);
  --glass-blur-sm: blur(14px) saturate(150%);
  --ls-display: -0.015em; --ls-title: -0.01em; --ls-caption: 0.01em;
  --dur-press: 100ms; --dur-ui: 140ms; --dur-sheet: 240ms;
  --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
  --touch-min: 44px;
}

* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 32px 24px;
  background: #1b1f26; color: var(--foreground);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  display: flex; gap: 40px; align-items: flex-start; justify-content: center; flex-wrap: wrap;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
.frame-label { color: #9aa3b2; font-size: 12px; text-align: center; margin-top: 10px; font-weight: 600; }

.device {
  width: 393px; height: 727px; border-radius: 28px; overflow: hidden;
  border: 1px solid #3a4150; box-shadow: 0 30px 80px rgb(0 0 0 / 55%);
  position: relative; background: var(--surface-0); flex: 0 0 auto;
}
.copilot-shell { --topbar-h: 2.75rem; --sheet-height: 56dvh; position: relative; display: block; width: 100%; height: 100%; overflow: clip; background: var(--surface-0); }

.copilot-topbar {
  z-index: 60; display: flex; align-items: center; gap: 0.625rem;
  height: var(--topbar-h); padding: 0 0.875rem;
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur-sm); backdrop-filter: var(--glass-blur-sm);
  border-bottom: 1px solid var(--border-1);
}
.brand-mark { width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0; background: linear-gradient(135deg,#22d3ee,#2563eb); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 11px; }
.copilot-topbar h1 { margin: 0; font-size: var(--fs-body-lg); font-weight: 800; letter-spacing: var(--ls-title); color: var(--text-1); }
.copilot-topbar nav { margin-left: auto; display: flex; gap: 2px; }
.copilot-topbar-link { border-radius: 999px; padding: 0.3rem 0.5rem; font-size: var(--fs-chip); font-weight: 700; color: var(--text-3); }
.ui-status { display: inline-flex; align-items: center; gap: 0.3rem; border-radius: 999px; padding: 0.2rem 0.5rem; font-size: var(--fs-chip); font-weight: 700; white-space: nowrap; }
.ui-status::before { content: ""; width: 0.4rem; height: 0.4rem; border-radius: 999px; background: currentColor; }
.ui-status-live { color: #67e8f9; background: var(--accent-soft); border: 1px solid var(--accent-line); }

.copilot-map { position: absolute; inset: var(--topbar-h) 0 0; overflow: hidden; background: var(--surface-map); }
.copilot-map svg.fake-map { position: absolute; inset: 0; width: 100%; height: 100%; }

.query-hero { position: absolute; z-index: 50; top: 0.625rem; left: 50%; width: calc(100% - 1.25rem); transform: translateX(-50%); display: flex; flex-direction: column; gap: 0.375rem; }
.query-hero-form { position: relative; }
.query-hero-input {
  width: 100%; height: 3rem;
  border: 1px solid var(--glass-border); border-radius: 1rem;
  background: var(--glass-bg-strong);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  padding: 0 3.25rem 0 1rem; font-size: var(--fs-body-lg); font-weight: 500; color: var(--text-1);
  box-shadow: var(--glass-edge), var(--glass-shadow); outline: none;
}
.query-hero-input::placeholder { color: var(--text-4); }
.query-hero-submit { position: absolute; top: 0.375rem; right: 0.375rem; display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: 0.75rem; background: #0891b2; color: #fff; font-weight: 700; }
/* 시트가 열려 있으면 예시·최근 질문 칩은 접는다 */
.copilot-shell[data-sheet="right"] .query-hero-chips.is-optional { display: none; }

/* 도크는 시트 위 가장자리 위로 — 시트가 도크를 덮어 한쪽에 갇히던 결함 방지 */
.copilot-shell[data-sheet="right"] .map-float-dock { z-index: 40; bottom: calc(var(--sheet-height) + 0.6rem); }
.map-float-dock { position: absolute; bottom: 1.25rem; left: 0; right: 0; translate: none; display: flex; justify-content: center; transition: bottom var(--dur-sheet) var(--ease-out-expo); }
.map-float-bar {
  display: flex; align-items: center; gap: 0.3rem;
  border: 1px solid var(--glass-border); border-radius: 999px;
  background: var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur-sm); backdrop-filter: var(--glass-blur-sm);
  padding: 0.25rem 0.3rem; box-shadow: var(--glass-edge), var(--glass-shadow);
}
.map-float-btn {
  min-height: var(--touch-min); min-width: var(--touch-min);
  flex: 0 0 auto; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: 999px; padding: 0 0.85rem;
  font-size: var(--fs-body); font-weight: 600; color: var(--text-2);
}
.map-float-btn.is-active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }

/* ─── 결과 시트: 무거운 유리(85%) + 손잡이. 스크림 없음 ─── */
.copilot-panel-right {
  position: absolute; z-index: 30; top: auto; right: 0; bottom: 0; left: 0;
  height: var(--sheet-height); max-height: 92dvh;
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: 1.1rem 1.1rem 0 0;
  border-top: 1px solid var(--glass-border);
  background: var(--glass-bg-strong);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 10%), 0 -16px 48px rgb(0 0 0 / 50%);
  transform: translateY(0); /* .sheet-open 상태 */
  transition: transform var(--dur-sheet) var(--ease-out-expo);
  color: var(--foreground); font-size: var(--fs-body); line-height: var(--lh-body);
}
/* 손잡이: 드래그는 1:1 추적, 놓으면 속도를 스프링에 넘긴다 (MOTION.md) */
.sheet-handle { display: flex; justify-content: center; padding: 0.55rem 0 0.2rem; cursor: grab; touch-action: none; }
.sheet-handle-bar { width: 2.5rem; height: 0.28rem; border-radius: 999px; background: rgb(148 163 184 / 45%); }
.sheet-snap-bar { display: flex; gap: 0.35rem; padding: 0 0.75rem 0.45rem; }
.sheet-snap-btn {
  flex: 1; min-height: var(--touch-min);
  border: 1px solid var(--border-2); border-radius: 999px; background: transparent;
  font-size: var(--fs-chip); font-weight: 700; color: var(--text-3);
}
.sheet-snap-btn.is-active { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }

.result-header { border-bottom: 1px solid var(--border-1); padding: 0.625rem 1rem 0.75rem; }
.section-label { margin: 0 0 2px; font-size: var(--fs-caption); font-weight: 800; letter-spacing: 0.06em; color: var(--accent); }
.ui-display { font-size: var(--fs-display); line-height: var(--lh-tight); font-weight: 800; letter-spacing: var(--ls-display); color: var(--text-1); margin: 0; }
.result-conclusion {
  margin-top: 0.5rem; border: 1px solid var(--accent-line); border-radius: 0.75rem;
  background: linear-gradient(180deg, rgb(34 211 238 / 10%) 0%, var(--surface-2) 100%);
  padding: 0.55rem 0.75rem; font-size: var(--fs-body); font-weight: 700; line-height: var(--lh-body); color: var(--text-1);
}
.result-conclusion-label { display: block; margin-bottom: 0.2rem; font-size: var(--fs-caption); font-weight: 800; letter-spacing: 0.04em; color: var(--accent); }
.result-meta { margin: 8px 0 0; font-size: var(--fs-chip); color: var(--text-3); }
.export-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.export-btn { border: 1px solid var(--border-2); border-radius: 999px; background: var(--surface-2); padding: 0.25rem 0.625rem; font-size: var(--fs-chip); font-weight: 700; color: var(--text-2); }

.copilot-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.rank-row { padding: 0.7rem 1rem; border-top: 1px solid var(--border-soft); }
.rank-row.is-selected { background: rgb(34 211 238 / 10%); box-shadow: inset 3px 0 0 var(--accent); }
.rank-row-btn { display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 0; }
.rank-badge { display: grid; place-items: center; width: 28px; height: 28px; flex-shrink: 0; border-radius: 999px; font-size: var(--fs-chip); font-weight: 800; background: var(--surface-3); color: var(--text-3); }
.rank-badge.top { background: var(--text-1); color: var(--surface-0); }
.rank-name { display: block; font-size: var(--fs-body-lg); font-weight: 700; color: var(--text-1); line-height: var(--lh-tight); }
.rank-note { display: block; margin-top: 2px; font-size: var(--fs-chip); color: var(--text-3); line-height: var(--lh-tight); }
.rank-value { margin-left: auto; font-size: var(--fs-body-lg); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--rank-value); }
.score-bar { display: block; height: 4px; margin: 6px 0 0 38px; overflow: hidden; border-radius: 999px; background: var(--score-track); }
.score-bar > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #67e8f9, #0891b2); }
.ui-caption { font-size: var(--fs-caption); line-height: var(--lh-tight); font-weight: 600; letter-spacing: var(--ls-caption); color: var(--text-3); margin: 0; }
</style>
</head>
<body>

<div>
  <div class="device">
    <main class="copilot-shell" data-sheet="right" data-testid="copilot-shell">
      <header class="copilot-topbar">
        <span class="brand-mark">◆</span>
        <h1>누리맵</h1>
        <nav aria-label="도움말·데이터">
          <button class="copilot-topbar-link">이용</button>
          <button class="copilot-topbar-link">데이터</button>
        </nav>
        <span class="ui-status ui-status-live">실데이터</span>
      </header>

      <section class="copilot-map" aria-label="지도 영역">
        <svg class="fake-map" viewBox="0 0 393 683" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="393" height="683" fill="#0a1120"/>
          <path d="M0 460 Q120 440 240 470 T393 500 L393 683 L0 683 Z" fill="#0d1828"/>
          <path d="M20 60 L140 30 L260 50 L370 100 L380 240 L340 380 L280 440 L180 460 L60 420 L10 300 Z" fill="#101a2c"/>
          <g stroke="#1c2c46" stroke-width="1.5" fill="none">
            <path d="M140 30 L150 180 L110 320"/><path d="M260 50 L250 200 L290 330"/>
            <path d="M60 420 L200 340 L340 380"/><path d="M150 180 L250 200"/>
          </g>
          <g>
            <path d="M20 220 L150 180 L140 310 L40 340 Z" fill="rgb(34 211 238 / 34%)"/>
            <path d="M150 180 L250 200 L240 320 L140 310 Z" fill="rgb(34 211 238 / 18%)"/>
            <path d="M40 340 L140 310 L200 340 L180 450 L60 420 Z" fill="rgb(34 211 238 / 45%)"/>
          </g>
          <g stroke="#26364f" stroke-width="3" fill="none" stroke-linecap="round">
            <path d="M40 100 Q160 160 300 140"/><path d="M100 420 Q200 360 320 380"/>
          </g>
          <g font-family="Pretendard, sans-serif" font-size="12" fill="#5b6f8f" font-weight="600">
            <text x="70" y="250">함안군</text><text x="185" y="250">창원시</text><text x="100" y="390">진주시</text>
          </g>
          <circle cx="110" cy="270" r="5" fill="#fb7185"/><circle cx="170" cy="240" r="5" fill="#fb7185"/>
        </svg>

        <div class="query-hero" data-testid="query-hero">
          <form class="query-hero-form">
            <input class="query-hero-input" placeholder="무엇이 궁금하세요? 예: 생활인구 많은 동네" aria-label="분석 질의">
            <button type="submit" class="query-hero-submit" aria-label="질의 실행">↑</button>
          </form>
          <!-- 시트가 열려 있어 예시 칩(.is-optional)은 숨겨진 상태 -->
        </div>

        <div class="map-float-dock">
          <div class="map-float-bar">
            <button class="map-float-btn" aria-pressed="false">조작</button>
            <button class="map-float-btn is-active" aria-pressed="true">결과</button>
            <button class="map-float-btn" data-testid="probe-toggle" aria-pressed="false">지점 분석</button>
          </div>
        </div>
      </section>

      <!-- 결과 시트: 무거운 유리 -->
      <aside class="copilot-panel copilot-panel-right sheet-open" aria-label="분석 결과 패널" data-testid="result-panel">
        <div class="sheet-handle" role="slider" aria-label="결과 패널 높이 조절" aria-valuemin="36" aria-valuemax="92" aria-valuenow="56">
          <span class="sheet-handle-bar"></span>
        </div>
        <div class="sheet-snap-bar" role="group" aria-label="결과 시트 높이 단계">
          <button class="sheet-snap-btn" aria-pressed="false">낮게</button>
          <button class="sheet-snap-btn is-active" aria-pressed="true">중간</button>
          <button class="sheet-snap-btn" aria-pressed="false">높게</button>
        </div>
        <header class="result-header">
          <p class="section-label">결과</p>
          <h2 class="ui-display">의료 접근성 취약 지역</h2>
          <div class="result-conclusion" data-testid="one-line-conclusion">
            <span class="result-conclusion-label">한 줄 결론</span>
            <p style="margin:0;" role="status">의료 접근성 취약지수 기준 상위 3곳은 산청군 시천면 · 하동군 악양면 · 함양군 서하면입니다.</p>
          </div>
          <p class="result-meta" data-testid="result-meta">305개 행정동 · 실데이터 · 기준월 2025-12</p>
          <div class="export-row" role="group" aria-label="보내기">
            <button class="export-btn">CSV</button><button class="export-btn">보고서</button>
            <button class="export-btn">한글</button><button class="export-btn">A4</button>
            <button class="export-btn">슬라이드</button><button class="export-btn">공유</button>
          </div>
        </header>
        <div class="copilot-scroll">
          <div class="rank-row is-selected">
            <button class="rank-row-btn" aria-label="1위 산청군 시천면, 100점">
              <span class="rank-badge top">1</span>
              <span style="min-width:0;flex:1;">
                <span class="rank-name">산청군 시천면</span>
                <span class="rank-note">인구 1만 명당 의료기관 1.2개/1만 명 · 고령인구 비율 41.3%</span>
              </span>
              <span class="rank-value">100점</span>
            </button>
            <span class="score-bar" aria-hidden="true"><span style="width:100%"></span></span>
          </div>
          <div class="rank-row">
            <button class="rank-row-btn" aria-label="2위 하동군 악양면, 92.7점">
              <span class="rank-badge top">2</span>
              <span style="min-width:0;flex:1;">
                <span class="rank-name">하동군 악양면</span>
                <span class="rank-note">최근접 의료기관 직선거리 6.8km · 2km 내 의료기관 0개</span>
              </span>
              <span class="rank-value">92.7점</span>
            </button>
            <span class="score-bar" aria-hidden="true"><span style="width:93%"></span></span>
          </div>
          <div class="rank-row">
            <button class="rank-row-btn" aria-label="3위 함양군 서하면, 89.1점">
              <span class="rank-badge top">3</span>
              <span style="min-width:0;flex:1;">
                <span class="rank-name">함양군 서하면</span>
                <span class="rank-note">인구 1만 명당 의료기관 1.8개/1만 명 · 고령인구 비율 38.9%</span>
              </span>
              <span class="rank-value">89.1점</span>
            </button>
            <span class="score-bar" aria-hidden="true"><span style="width:89%"></span></span>
          </div>
          <div class="rank-row">
            <button class="rank-row-btn" aria-label="4위 거창군 가북면, 85.4점">
              <span class="rank-badge">4</span>
              <span style="min-width:0;flex:1;">
                <span class="rank-name">거창군 가북면</span>
                <span class="rank-note">최근접 의료기관 직선거리 5.2km · 2km 내 의료기관 0개</span>
              </span>
              <span class="rank-value">85.4점</span>
            </button>
            <span class="score-bar" aria-hidden="true"><span style="width:85%"></span></span>
          </div>
        </div>
      </aside>
    </main>
  </div>
  <p class="frame-label">393×727 · 결과 시트 56dvh — 지도 위 40%가 남고 도크는 시트 위로</p>
</div>

</body>
</html>
