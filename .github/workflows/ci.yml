name: ci

on:
  push:
    branches: [master, main, "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit verify
        run: npm run verify:unit
      - name: Install Playwright browser
        if: ${{ hashFiles('tests/e2e/**/*.ts') != '' }}
        run: npx playwright install --with-deps chromium
      - name: Build for e2e
        run: npm run build
      - name: E2E
        env:
          VERIFY_E2E: "1"
          CI: "true"
        run: npm run test:e2e
        continue-on-error: false

  smoke-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    # 배포 시차(Vercel 반영 지연)·외부 의존(카카오·KOSIS) 때문에 실패해도 머지를
    # 막지 않는다. 붉으면 배포본을 사람이 본다. 전체 12종은 출시 전 수동으로
    # `npm run verify:prod`를 돌린다.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Wait for the new build on production
        id: wait
        run: |
          node scripts/wait-for-prod-build.mjs https://gnbc.site/ ${{ github.sha }} 300 20 | tee wait.log
          echo "skip=$(grep -q SKIPPED wait.log && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Production checks (fast subset)
        if: steps.wait.outputs.skip != 'true'
        env:
          PROD_URL: https://gnbc.site/
        run: node scripts/verify-prod.mjs https://gnbc.site/ terms map-overlap sgg probe
